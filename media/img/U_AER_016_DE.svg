<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 418" role="img" aria-labelledby="title desc">
<title id="title">Axialer Lastpfad mit und ohne Fuge</title>
<desc id="desc">Der einteilige Stab dehnt sich. Beim gefügten Stab trägt die Fuge zur gesamten Verlängerung bei.</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#215872"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#883707"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#18252e"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#687783"/></marker>
</defs>
<rect width="840" height="418" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif" fill="#18252e">
<text x="42" y="50" font-size="28" text-anchor="start" font-weight="700" fill="#18252e">Axialer Lastpfad mit und ohne Fuge</text>
<line x1="42" y1="74" x2="798" y2="74" stroke="#c6cdd1" stroke-width="1.5" stroke-linecap="round"/>
<line x1="42" y1="238" x2="798" y2="238" stroke="#c6cdd1" stroke-width="1.5" stroke-linecap="round"/>
<text x="43" y="119" font-size="22" text-anchor="start" font-weight="700" fill="#18252e">Ein einteiliger Stab</text>
<line x1="210" y1="172" x2="75" y2="172" stroke="#215872" stroke-width="3.6" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="630" y1="172" x2="765" y2="172" stroke="#215872" stroke-width="3.6" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="90" y="157" font-size="20" text-anchor="start" font-weight="400" fill="#215872">N</text>
<text x="750" y="157" font-size="20" text-anchor="end" font-weight="400" fill="#215872">N</text>
<rect x="210" y="147" width="420" height="50" rx="5" fill="#eef4f6" stroke="#215872" stroke-width="2.5"/>
<text x="420" y="179" font-size="19" text-anchor="middle" font-weight="700" fill="#18252e">Stab</text>
<text x="420" y="222" font-size="19" text-anchor="middle" font-weight="400" fill="#18252e">ΔL = ΔL(Stab)</text>
<text x="43" y="274" font-size="22" text-anchor="start" font-weight="700" fill="#18252e">Stab mit Fuge</text>
<line x1="210" y1="327" x2="75" y2="327" stroke="#215872" stroke-width="3.6" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<line x1="630" y1="327" x2="765" y2="327" stroke="#215872" stroke-width="3.6" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="90" y="312" font-size="20" text-anchor="start" font-weight="400" fill="#215872">N</text>
<text x="750" y="312" font-size="20" text-anchor="end" font-weight="400" fill="#215872">N</text>
<rect x="210" y="302" width="183" height="50" rx="5" fill="#eef4f6" stroke="#215872" stroke-width="2.5"/>
<rect x="447" y="302" width="183" height="50" rx="5" fill="#eef4f6" stroke="#215872" stroke-width="2.5"/>
<rect x="393" y="302" width="54" height="50" rx="4" fill="#faeee9" stroke="#883707" stroke-width="2.5"/>
<path d="M401 327 L407 317 L413 337 L420 317 L427 337 L433 317 L439 327" fill="none" stroke="#883707" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="300" y="334" font-size="19" text-anchor="middle" font-weight="700" fill="#18252e">Stab</text>
<text x="538" y="334" font-size="19" text-anchor="middle" font-weight="700" fill="#18252e">Stab</text>
<text x="420" y="377" font-size="19" text-anchor="middle" font-weight="400" fill="#18252e">ΔL = ΔL(Stab) + ΔL(Fuge)</text>
</g>
</svg>
