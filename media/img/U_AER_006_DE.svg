<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" xml:lang="de" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Auftriebsverlauf bei Strömungsablösung</title>
<desc id="figure-description">Bei großer Neigung löst sich die profilnahe Strömung in der Skizze. Der synthetische Auftriebsbeiwert steigt von 0,20 auf 1,00 bei 12 Grad und fällt bei 16 Grad auf 0,82, während die lineare Vergleichsrechnung weiter ansteigt.</desc>
