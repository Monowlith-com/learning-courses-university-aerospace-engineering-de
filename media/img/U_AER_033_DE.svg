<svg xmlns="http://www.w3.org/2000/svg" xml:lang="de" viewBox="0 0 860 514" role="img" aria-labelledby="title desc">
<title id="title">Evidenz für zwei Hochwasserkarten</title>
<desc id="desc">Eine Matrix vergleicht rechtzeitige Karten, Mindestabdeckung, falsche Markierungen und Wiederholbarkeit. Konzept B erfüllt die ersten beiden Kriterien. Der Wiederholungsnachweis steht aus.</desc>
<rect width="860" height="514" fill="#fff"/>
<g font-family="Source Sans 3, Arial, sans-serif">
<text x="42" y="48" font-size="30" fill="#20272e" text-anchor="start" font-weight="600">Evidenz für zwei Hochwasserkarten</text>
<text x="42" y="77" font-size="19" fill="#46525a" text-anchor="start">Synthetischer Vergleich auf demselben Satz von fünf Warnszenarien</text>
<line x1="42" y1="93" x2="818" y2="93" stroke="#d5dade" stroke-width="1"/>
<text x="42" y="132" font-size="19" fill="#20272e" text-anchor="start" font-weight="600">Prüfgröße</text>
<text x="335" y="132" font-size="19" fill="#20272e" text-anchor="start" font-weight="600">Ziel</text>
<text x="615" y="132" font-size="19" fill="#20272e" text-anchor="end" font-weight="600">Konzept A</text>
<text x="786" y="132" font-size="19" fill="#20272e" text-anchor="end" font-weight="600">Konzept B</text>
<line x1="42" y1="146" x2="818" y2="146" stroke="#69747c" stroke-width="1.5"/>
<text x="42" y="180" font-size="19" fill="#20272e" text-anchor="start">Rechtzeitige Karten</text>
<text x="335" y="180" font-size="19" fill="#20272e" text-anchor="start">≥ 4/5 in 12 h</text>
<text x="615" y="180" font-size="22" fill="#245a3d" text-anchor="end" font-weight="600">5/5</text>
<text x="615" y="203" font-size="18" fill="#245a3d" text-anchor="end">erfüllt</text>
<text x="786" y="180" font-size="22" fill="#245a3d" text-anchor="end" font-weight="600">4/5</text>
<text x="786" y="203" font-size="18" fill="#245a3d" text-anchor="end">erfüllt</text>
<line x1="42" y1="214" x2="818" y2="214" stroke="#d5dade" stroke-width="1"/>
<text x="42" y="271" font-size="18" fill="#46525a" text-anchor="start">je rechtzeitige Karte · Minimum</text>
<text x="42" y="248" font-size="19" fill="#20272e" text-anchor="start">Erfasste Referenzfläche</text>
<text x="335" y="248" font-size="19" fill="#20272e" text-anchor="start">≥ 80 %</text>
<text x="615" y="248" font-size="22" fill="#883707" text-anchor="end" font-weight="600">70 %</text>
<text x="615" y="271" font-size="18" fill="#883707" text-anchor="end">unter Ziel</text>
<text x="786" y="248" font-size="22" fill="#245a3d" text-anchor="end" font-weight="600">85 %</text>
<text x="786" y="271" font-size="18" fill="#245a3d" text-anchor="end">erfüllt</text>
<line x1="42" y1="282" x2="818" y2="282" stroke="#d5dade" stroke-width="1"/>
<text x="42" y="339" font-size="18" fill="#46525a" text-anchor="start">je rechtzeitige Karte · Maximum</text>
<text x="42" y="316" font-size="19" fill="#20272e" text-anchor="start">Falsch markierte Fläche</text>
<text x="335" y="316" font-size="19" fill="#20272e" text-anchor="start">≤ 20 %</text>
<text x="615" y="316" font-size="22" fill="#245a3d" text-anchor="end" font-weight="600">12 %</text>
<text x="615" y="339" font-size="18" fill="#245a3d" text-anchor="end">erfüllt</text>
<text x="786" y="316" font-size="22" fill="#245a3d" text-anchor="end" font-weight="600">18 %</text>
<text x="786" y="339" font-size="18" fill="#245a3d" text-anchor="end">erfüllt</text>
<line x1="42" y1="350" x2="818" y2="350" stroke="#d5dade" stroke-width="1"/>
<text x="42" y="407" font-size="18" fill="#46525a" text-anchor="start">mit archivierten Eingaben</text>
<text x="42" y="384" font-size="19" fill="#20272e" text-anchor="start">Wiederholung</text>
<text x="335" y="384" font-size="19" fill="#20272e" text-anchor="start">durch zweites Team</text>
<text x="615" y="384" font-size="22" fill="#20272e" text-anchor="end" font-weight="600">offen</text>
<text x="786" y="384" font-size="22" fill="#20272e" text-anchor="end" font-weight="600">offen</text>
<line x1="42" y1="418" x2="818" y2="418" stroke="#d5dade" stroke-width="1"/>
<text x="42" y="458" font-size="23" fill="#20272e" text-anchor="start" font-weight="600">Nächste Erprobung mit Konzept B</text>
<text x="42" y="485" font-size="19" fill="#46525a" text-anchor="start">Ergebniswiederholung und Validierung mit Anwendern stehen aus.</text>
</g>
</svg>
