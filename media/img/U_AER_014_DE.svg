<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 466" role="img" aria-labelledby="title desc">
<title id="title">Zwei Wege des Impulsaustauschs</title>
<desc id="desc">Luft strömt durch ein atmosphärisches System. Im Vakuummodell stammt die abgegebene Masse aus dem Fahrzeug.</desc>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#215872"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#883707"/></marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#18252e"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#687783"/></marker>
</defs>
<rect width="840" height="466" fill="#fff"/>
<g font-family="DejaVu Sans, sans-serif" fill="#18252e">
<text x="42" y="50" font-size="28" text-anchor="start" font-weight="700" fill="#18252e">Zwei Wege des Impulsaustauschs</text>
<line x1="42" y1="74" x2="798" y2="74" stroke="#c6cdd1" stroke-width="1.5" stroke-linecap="round"/>
<line x1="42" y1="267" x2="798" y2="267" stroke="#c6cdd1" stroke-width="1.5" stroke-linecap="round"/>
<text x="43" y="122" font-size="22" text-anchor="start" font-weight="700" fill="#18252e">Atmosphäre</text>
<rect x="350" y="146" width="166" height="66" rx="8" fill="#eef4f6" stroke="#215872" stroke-width="2.5"/>
<text x="433" y="185" font-size="20" text-anchor="middle" font-weight="700" fill="#18252e">Fahrzeug</text>
<line x1="347" y1="179" x2="65" y2="179" stroke="#215872" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="66" y="164" font-size="18" text-anchor="start" font-weight="400" fill="#215872">Luftstrom nach hinten</text>
<line x1="774" y1="179" x2="519" y2="179" stroke="#215872" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="774" y="164" font-size="18" text-anchor="end" font-weight="400" fill="#215872">Umgebungsluft</text>
<line x1="350" y1="234" x2="516" y2="234" stroke="#883707" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<text x="530" y="241" font-size="19" text-anchor="start" font-weight="400" fill="#883707">Schub</text>
<text x="43" y="304" font-size="22" text-anchor="start" font-weight="700" fill="#18252e">Vakuummodell</text>
<rect x="350" y="328" width="166" height="66" rx="8" fill="#eef4f6" stroke="#215872" stroke-width="2.5"/>
<text x="433" y="367" font-size="20" text-anchor="middle" font-weight="700" fill="#18252e">Fahrzeug</text>
<line x1="347" y1="361" x2="65" y2="361" stroke="#215872" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
<text x="66" y="346" font-size="18" text-anchor="start" font-weight="400" fill="#215872">Abgegebene Masse</text>
<text x="774" y="367" font-size="18" text-anchor="end" font-weight="400" fill="#18252e">Kein Umgebungseinlass</text>
<line x1="350" y1="416" x2="516" y2="416" stroke="#883707" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<text x="530" y="423" font-size="19" text-anchor="start" font-weight="400" fill="#883707">Schub</text>
</g>
</svg>
