<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 384" xml:lang="de" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Körperachsen und Beitrag zum Nickmoment</title>
<desc id="figure-description">Die Längsachse zeigt zur Nase, die Hochachse in der Seitenansicht nach unten und die Querachse aus der Ebene. Eine Kraft nach unten vor dem Schwerpunkt ergibt ein negatives Nickmoment.</desc>
