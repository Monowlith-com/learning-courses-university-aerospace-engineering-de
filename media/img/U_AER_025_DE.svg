<path d="M 559.45 144.47 L 569 139 L 559.45 133.53" fill="none" stroke="#215872" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="513" y1="262" x2="569" y2="262" stroke="#883707" stroke-width="3"/>
<path d="M 559.45 267.47 L 569 262 L 559.45 256.53" fill="none" stroke="#883707" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="119" y="263" text-anchor="middle" fill="#5B6A70" font-size="19" font-weight="400">Δp in Pa</text>
<text x="119" y="291" text-anchor="middle" fill="#5B6A70" font-size="19" font-weight="400">Zeitstempel</text>
<text x="43" y="338" text-anchor="start" fill="#5B6A70" font-size="18" font-weight="400">Referenz: dieselbe Zeitbasis für Aufnahme und Prüfung.</text>
