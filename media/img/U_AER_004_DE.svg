<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 338" xml:lang="de" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Dynamischer Druck bei gleicher Geschwindigkeit</title>
<desc id="figure-description">Bei 40 Metern pro Sekunde ergibt die höhere Dichte von 1,20 Kilogramm pro Kubikmeter 960 Pascal. Bei 0,90 Kilogramm pro Kubikmeter sind es 720 Pascal.</desc>
<defs><marker id="ink-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#212c35"/></marker><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#215872"/></marker><marker id="rust-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#883707"/></marker></defs>
<rect x="0" y="0" width="820" height="338" fill="#fff" />
<g font-family="Arial, sans-serif">
<text x="38" y="48" font-size="28" fill="#212c35" text-anchor="start" font-weight="700">Dynamischer Druck bei gleicher Geschwindigkeit</text>
<line x1="38" y1="68" x2="782" y2="68" stroke="#bac3c9" stroke-width="2" />
<text x="38" y="111" font-size="22" fill="#212c35" text-anchor="start" font-weight="400">U = 40 m/s</text>
<text x="780" y="111" font-size="23" fill="#212c35" text-anchor="end" font-weight="400">q = ½ ρ U²</text>
<text x="38" y="165" font-size="21" fill="#212c35" text-anchor="start" font-weight="400">ρ = 1,20 kg/m³</text>
<rect x="271" y="140" width="422.4" height="32" fill="#215872" />
<text x="706" y="163" font-size="22" fill="#215872" text-anchor="start" font-weight="700">960 Pa</text>
<text x="38" y="234" font-size="21" fill="#212c35" text-anchor="start" font-weight="400">ρ = 0,90 kg/m³</text>
<rect x="271" y="209" width="316.8" height="32" fill="#883707" />
<text x="600" y="232" font-size="22" fill="#883707" text-anchor="start" font-weight="700">720 Pa</text>
<line x1="271" y1="276" x2="711" y2="276" stroke="#bac3c9" stroke-width="2" />
<line x1="271" y1="273" x2="271" y2="282" stroke="#212c35" stroke-width="2" />
<line x1="491" y1="273" x2="491" y2="282" stroke="#212c35" stroke-width="2" />
<line x1="711" y1="273" x2="711" y2="282" stroke="#212c35" stroke-width="2" />
<text x="271" y="312" font-size="18" fill="#212c35" text-anchor="middle" font-weight="400">0</text>
<text x="491" y="312" font-size="18" fill="#212c35" text-anchor="middle" font-weight="400">500</text>
<text x="711" y="312" font-size="18" fill="#212c35" text-anchor="middle" font-weight="400">1 000 Pa</text>
</g>
</svg>
