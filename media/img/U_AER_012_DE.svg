<line x1="508" y1="199" x2="508" y2="120" stroke="#883707" stroke-width="3.2" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
<text x="310" y="123" font-size="20" text-anchor="end" font-weight="700" fill="#883707">Wärme Q̇</text>
<text x="528" y="123" font-size="20" text-anchor="start" font-weight="700" fill="#883707">Wellenleistung Ẇₛ</text>
