<text x="686" y="289" font-size="20" text-anchor="middle" font-weight="400" fill="#215872">ṁ  |  h₂, V₂, z₂</text>
<rect x="358" y="224" width="124" height="60" rx="7" fill="#fff" stroke="#215872" stroke-width="2.5"/>
