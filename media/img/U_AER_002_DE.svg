<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 405" role="img" aria-labelledby="title desc" xml:lang="de">
  <title id="title">Kraft, Weg und Zeit am Schlitten</title>
  <desc id="desc">Eine Kraft bewegt den Schlitten entlang einer Schiene. Kraftstoß und Arbeit beschreiben seine Bewegung.</desc>
  <defs>
    <marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#215872"/></marker>
    <marker id="brown" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#883707"/></marker>
  </defs>
  <rect width="840" height="405" fill="#fff"/>
  <g font-family="system-ui, sans-serif">
    <text x="32" y="49" fill="#1d303b" font-size="28" text-anchor="start">Kraft, Weg und Zeit am Schlitten</text>
    <path d="M32 68 H808" stroke="#c3cad0"/>
    <line x1="80" y1="240" x2="758" y2="240" stroke="#1d303b" stroke-width="3"/>
    <rect x="95" y="161" width="120" height="57" rx="8" fill="#fff" stroke="#7b8790" stroke-width="2" stroke-dasharray="8 6"/>
    <rect x="445" y="161" width="120" height="57" rx="8" fill="#e9eef1" stroke="#7b8790" stroke-width="2"/>
    <circle cx="470" cy="229" r="10" fill="#fff" stroke="#215872" stroke-width="3"/>
    <circle cx="540" cy="229" r="10" fill="#fff" stroke="#215872" stroke-width="3"/>
    <text x="505" y="197" fill="#1d303b" font-size="20" text-anchor="middle">Schlitten</text>
    <line x1="565" y1="185" x2="737" y2="185" stroke="#883707" stroke-width="3" marker-end="url(#brown)"/>
    <text x="610" y="165" fill="#883707" font-size="18" text-anchor="start">Resultierende</text>
    <line x1="150" y1="280" x2="510" y2="280" stroke="#215872" stroke-width="3" marker-end="url(#blue)"/>
    <text x="330" y="308" fill="#215872" font-size="19" text-anchor="middle">Weg Δx</text>
    <text x="330" y="337" fill="#1d303b" font-size="19" text-anchor="middle">Zeit Δt</text>
    <text x="530" y="315" fill="#1d303b" font-size="20" text-anchor="start">Kraftstoß  ·  F Δt</text>
    <text x="530" y="348" fill="#1d303b" font-size="20" text-anchor="start">Arbeit  ·  F Δx</text>
  </g>
</svg>
