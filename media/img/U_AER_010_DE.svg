<title id="figure-title">Drei Hüllkurven der Nickschwingung</title>
<desc id="figure-description">Drei Modellantworten beginnen bei zwei Grad. Nach vier Sekunden liegen sie bei 0,74 Grad, 2 Grad und 5,44 Grad. Die gestrichelten Hüllkurven markieren Abklingen, konstante Amplitude und Wachstum.</desc>
