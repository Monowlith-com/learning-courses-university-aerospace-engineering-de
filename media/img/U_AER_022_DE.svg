    <text x="216" y="354" text-anchor="middle" font-size="20">Innerer Wärmeeintrag</text>
    <path d="M296 216 h73" stroke="#883707" stroke-width="3" marker-end="url(#brown-arrow)"/>
    <text x="333" y="190" text-anchor="middle" fill="#883707" font-size="19">Abstrahlung</text>
    <rect x="528" y="204" width="152" height="57" rx="7" fill="#f7f7f7" stroke="#526169" stroke-width="2"/>
    <text x="604" y="240" text-anchor="middle">Bauteil</text>
