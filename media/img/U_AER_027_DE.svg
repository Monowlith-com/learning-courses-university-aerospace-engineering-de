<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-labelledby="title description">
<title id="title">Zwei Messpfade, eine Versorgung</title>
<desc id="description">Eine Versorgung speist zwei getrennte Messkanäle. Die gestrichelten Linien sind Versorgungspfade, die durchgezogenen Linien Datenpfade.</desc>
<rect x="0" y="0" width="820" height="400" fill="#fff"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="32" y="48" text-anchor="start" fill="#182932" font-size="29" font-weight="700">Zwei Messpfade, eine Versorgung</text>
<line x1="32" y1="68" x2="788" y2="68" stroke="#D8E0E2" stroke-width="2"/>
<rect x="305" y="91" width="209" height="70" rx="8" fill="#fff" stroke="#883707" stroke-width="2"/>
<text x="409.5" y="120.0" text-anchor="middle" fill="#883707" font-size="20" font-weight="600">Gemeinsame</text>
<text x="409.5" y="146.0" text-anchor="middle" fill="#883707" font-size="20" font-weight="600">Versorgung</text>
<line x1="409" y1="163" x2="409" y2="191" stroke="#883707" stroke-width="3" stroke-dasharray="8 5"/>
<line x1="192" y1="191" x2="622" y2="191" stroke="#883707" stroke-width="3" stroke-dasharray="8 5"/>
<line x1="192" y1="191" x2="192" y2="216" stroke="#883707" stroke-width="3" stroke-dasharray="8 5"/>
<path d="M 186.53 206.45 L 192 216 L 197.47 206.45" fill="none" stroke="#883707" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="622" y1="191" x2="622" y2="216" stroke="#883707" stroke-width="3" stroke-dasharray="8 5"/>
<path d="M 616.53 206.45 L 622 216 L 627.47 206.45" fill="none" stroke="#883707" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="95" y="218" width="195" height="62" rx="8" fill="#fff" stroke="#215872" stroke-width="2"/>
<text x="192.5" y="256.0" text-anchor="middle" fill="#215872" font-size="20" font-weight="600">Messkanal A</text>
<rect x="524" y="218" width="195" height="62" rx="8" fill="#fff" stroke="#215872" stroke-width="2"/>
<text x="621.5" y="256.0" text-anchor="middle" fill="#215872" font-size="20" font-weight="600">Messkanal B</text>
<line x1="291" y1="270" x2="345" y2="307" stroke="#215872" stroke-width="3"/>
<path d="M 334.04 306.11 L 345 307 L 340.21 297.10" fill="none" stroke="#215872" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="523" y1="270" x2="475" y2="307" stroke="#215872" stroke-width="3"/>
<path d="M 479.22 296.84 L 475 307 L 485.90 305.50" fill="none" stroke="#215872" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="293" y="310" width="234" height="61" rx="8" fill="#fff" stroke="#215872" stroke-width="2"/>
<text x="410.0" y="347.5" text-anchor="middle" fill="#215872" font-size="20" font-weight="600">Signalprüfung</text>
<text x="40" y="183" text-anchor="start" fill="#883707" font-size="18" font-weight="400">Versorgung</text>
<text x="46" y="327" text-anchor="start" fill="#215872" font-size="18" font-weight="400">Messsignal</text>
</g>
</svg>
